<svg xmlns="http://www.w3.org/2000/svg" width="854" height="300" viewBox="0 0 854 300" role="img" aria-label="tablecn: open-source data table blocks for shadcn/ui">
<style>
.in { animation: in .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { opacity: .6; transform: scale(1); } to { opacity: 0; transform: scale(3); } }

.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
</style>
<defs>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e4e4e7"/></pattern>
  <radialGradient id="fade" cx=".3" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="m"><rect width="854" height="300" fill="url(#fade)"/></mask>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#93c5fd" stop-opacity=".18"/><stop offset="1" stop-color="#93c5fd" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect x=".5" y=".5" width="853" height="299" rx="14"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="854" height="300" fill="#ffffff"/>
  <rect width="854" height="300" fill="url(#dots)" mask="url(#m)"/>

  <ellipse cx="646" cy="130" rx="260" ry="150" fill="url(#glow)"/>
  <g class="in">
    <text x="44" y="68" class="mono" font-size="11.5" fill="#2563eb" letter-spacing="1.5">FEATURED PROJECT</text>
    <text x="42" y="108" class="sans" font-size="32" font-weight="700" fill="#09090b" letter-spacing="-.8">tablecn</text>
    <text x="44" y="140" class="sans" font-size="15" fill="#52525b">Open-source data table blocks for shadcn/ui.</text>
    <text x="44" y="162" class="sans" font-size="15" fill="#52525b">Filter, search, sort and page, all in the URL.</text>
  </g>
  <g class="in" style="animation-delay:.15s">
<rect x="44" y="188" width="108" height="24" rx="12" fill="#f4f4f5" stroke="#e4e4e7"/><text x="98" y="204" text-anchor="middle" class="sans" font-size="12" fill="#52525b">TanStack Table</text>
<rect x="159.84" y="188" width="111" height="24" rx="12" fill="#f4f4f5" stroke="#e4e4e7"/><text x="216" y="204" text-anchor="middle" class="sans" font-size="12" fill="#52525b">shadcn registry</text>
<rect x="279.28" y="188" width="178" height="24" rx="12" fill="#f4f4f5" stroke="#e4e4e7"/><text x="368" y="204" text-anchor="middle" class="sans" font-size="12" fill="#52525b">Radix · Base UI · React Aria</text>
  </g>
  <g class="in" style="animation-delay:.3s">
    <text x="44" y="252" class="sans" font-size="13" fill="#a1a1aa"><tspan fill="#09090b" font-weight="600">4</tspan> npm packages   ·   <tspan fill="#09090b" font-weight="600">15</tspan> filter operators   ·   <tspan fill="#09090b" font-weight="600">EN / VI</tspan></text>
  </g>
  <g class="in" style="animation-delay:.2s">
    <rect x="474" y="32" width="344" height="236" rx="10" fill="#fafafa" stroke="#e4e4e7"/>
    <text x="488" y="54" class="mono" font-size="11" fill="#a1a1aa">?status__eq=paid&amp;sort=-amount</text>
    <line x1="474" y1="66" x2="818" y2="66" stroke="#e4e4e7"/>
    <rect x="486" y="78" width="98" height="24" rx="12" fill="#f4f4f5" stroke="#e4e4e7"/><text x="535" y="94" text-anchor="middle" class="sans" font-size="11.5" fill="#09090b">Status is Paid</text><rect x="598" y="78" width="103" height="24" rx="12" fill="#f4f4f5" stroke="#e4e4e7"/><text x="649" y="94" text-anchor="middle" class="sans" font-size="11.5" fill="#09090b">Amount 10 – 50</text>
    <text x="490" y="132" class="sans" font-size="11" font-weight="600" fill="#a1a1aa">NAME</text>
    <text x="654" y="132" class="sans" font-size="11" font-weight="600" fill="#a1a1aa">STATUS</text>
    <text x="802" y="132" text-anchor="end" class="sans" font-size="11" font-weight="600" fill="#a1a1aa">AMOUNT ↓</text>
  </g>
  <g class="in" style="animation-delay:0.5s"><line x1="474" y1="141" x2="818" y2="141" stroke="#e4e4e7"/><text x="490" y="160" class="sans" font-size="12.5" fill="#09090b">Nguyễn Văn An</text><rect x="654" y="147" width="44" height="18" rx="9" fill="#16a34a" fill-opacity=".14"/><text x="676" y="160" text-anchor="middle" class="sans" font-size="11" fill="#16a34a">Paid</text><text x="802" y="160" text-anchor="end" class="mono" font-size="12" fill="#52525b">42.00</text></g><g class="in" style="animation-delay:0.6s"><line x1="474" y1="171" x2="818" y2="171" stroke="#e4e4e7"/><text x="490" y="190" class="sans" font-size="12.5" fill="#09090b">Trần Thị Bình</text><rect x="654" y="177" width="44" height="18" rx="9" fill="#16a34a" fill-opacity=".14"/><text x="676" y="190" text-anchor="middle" class="sans" font-size="11" fill="#16a34a">Paid</text><text x="802" y="190" text-anchor="end" class="mono" font-size="12" fill="#52525b">38.50</text></g><g class="in" style="animation-delay:0.7s"><line x1="474" y1="201" x2="818" y2="201" stroke="#e4e4e7"/><text x="490" y="220" class="sans" font-size="12.5" fill="#09090b">Lê Hoàng Nam</text><rect x="654" y="207" width="44" height="18" rx="9" fill="#16a34a" fill-opacity=".14"/><text x="676" y="220" text-anchor="middle" class="sans" font-size="11" fill="#16a34a">Paid</text><text x="802" y="220" text-anchor="end" class="mono" font-size="12" fill="#52525b">27.90</text></g><g class="in" style="animation-delay:0.8s"><line x1="474" y1="231" x2="818" y2="231" stroke="#e4e4e7"/><text x="490" y="250" class="sans" font-size="12.5" fill="#09090b">Phạm Minh Thư</text><rect x="654" y="237" width="44" height="18" rx="9" fill="#16a34a" fill-opacity=".14"/><text x="676" y="250" text-anchor="middle" class="sans" font-size="11" fill="#16a34a">Paid</text><text x="802" y="250" text-anchor="end" class="mono" font-size="12" fill="#52525b">15.00</text></g>
</g>
<rect x=".5" y=".5" width="853" height="299" rx="14" fill="none" stroke="#e4e4e7"/>
</svg>
