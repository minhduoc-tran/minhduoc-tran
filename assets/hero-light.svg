<svg xmlns="http://www.w3.org/2000/svg" width="854" height="280" viewBox="0 0 854 280" role="img" aria-label="Tran Minh Duoc, web developer from Cần Thơ, Việt Nam">
<style>
.in { animation: in .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { opacity: .6; transform: scale(1); } to { opacity: 0; transform: scale(3); } }

.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
</style>
<defs>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e4e4e7"/></pattern>
  <radialGradient id="fade" cx=".3" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="m"><rect width="854" height="280" fill="url(#fade)"/></mask>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#93c5fd" stop-opacity=".18"/><stop offset="1" stop-color="#93c5fd" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect x=".5" y=".5" width="853" height="279" rx="14"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="854" height="280" fill="#ffffff"/>
  <rect width="854" height="280" fill="url(#dots)" mask="url(#m)"/>

  <ellipse cx="640" cy="140" rx="300" ry="160" fill="url(#glow)"/>
  <g class="in">
    <text x="44" y="78" class="mono" font-size="13" fill="#a1a1aa">~/minhduoc-tran</text>
    <text x="42" y="126" class="sans" font-size="42" font-weight="700" fill="#09090b" letter-spacing="-1">Tran Minh Duoc</text>
  </g>
  <g class="in" style="animation-delay:.15s">
    <text x="44" y="162" class="sans" font-size="16" fill="#52525b">Web developer building data-heavy interfaces</text>
    <text x="44" y="185" class="sans" font-size="16" fill="#52525b">with React, Next.js and TypeScript.</text>
  </g>
  <g class="in" style="animation-delay:.3s">
    <circle class="pulse" cx="52" cy="226" r="4" fill="#16a34a"/>
    <circle cx="52" cy="226" r="4" fill="#16a34a"/>
    <text x="64" y="230" class="sans" font-size="13" fill="#52525b">Building <tspan fill="#09090b" font-weight="600">tablecn</tspan>  ·  Cần Thơ, Việt Nam</text>
  </g>
  <g class="in" style="animation-delay:.2s">
    <rect x="474" y="36" width="344" height="208" rx="10" fill="#fafafa" stroke="#e4e4e7"/>
    <line x1="474" y1="70" x2="818" y2="70" stroke="#e4e4e7"/>
    <circle cx="492" cy="53" r="4.5" fill="#e4e4e7"/>
    <circle cx="507" cy="53" r="4.5" fill="#e4e4e7"/>
    <circle cx="522" cy="53" r="4.5" fill="#e4e4e7"/>
    <text x="646.0" y="57" text-anchor="middle" class="mono" font-size="11.5" fill="#a1a1aa">about.ts</text>
  </g>
  <g class="in" style="animation-delay:0.35s"><text x="490" y="102" class="mono" font-size="11.5" fill="#a1a1aa" opacity=".6">1</text><text x="512" y="102" class="mono" font-size="12.5"><tspan fill="#9333ea">export const </tspan><tspan fill="#09090b">duoc</tspan><tspan fill="#a1a1aa"> = {</tspan></text></g><g class="in" style="animation-delay:0.47s"><text x="490" y="125" class="mono" font-size="11.5" fill="#a1a1aa" opacity=".6">2</text><text x="526" y="125" class="mono" font-size="12.5"><tspan fill="#1d4ed8">role</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#15803d">"Web Developer"</tspan><tspan fill="#a1a1aa">,</tspan></text></g><g class="in" style="animation-delay:0.59s"><text x="490" y="148" class="mono" font-size="11.5" fill="#a1a1aa" opacity=".6">3</text><text x="526" y="148" class="mono" font-size="12.5"><tspan fill="#1d4ed8">location</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#15803d">"Cần Thơ, VN"</tspan><tspan fill="#a1a1aa">,</tspan></text></g><g class="in" style="animation-delay:0.71s"><text x="490" y="171" class="mono" font-size="11.5" fill="#a1a1aa" opacity=".6">4</text><text x="526" y="171" class="mono" font-size="12.5"><tspan fill="#1d4ed8">stack</tspan><tspan fill="#a1a1aa">: [</tspan><tspan fill="#15803d">"React"</tspan><tspan fill="#a1a1aa">, </tspan><tspan fill="#15803d">"Next.js"</tspan><tspan fill="#a1a1aa">, </tspan><tspan fill="#15803d">"TS"</tspan><tspan fill="#a1a1aa">],</tspan></text></g><g class="in" style="animation-delay:0.83s"><text x="490" y="194" class="mono" font-size="11.5" fill="#a1a1aa" opacity=".6">5</text><text x="526" y="194" class="mono" font-size="12.5"><tspan fill="#1d4ed8">building</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#15803d">"tablecn"</tspan><tspan fill="#a1a1aa">,</tspan></text></g><g class="in" style="animation-delay:0.95s"><text x="490" y="217" class="mono" font-size="11.5" fill="#a1a1aa" opacity=".6">6</text><text x="512" y="217" class="mono" font-size="12.5"><tspan fill="#a1a1aa">};</tspan></text></g>
  <rect class="blink" x="532" y="206" width="7" height="14" fill="#2563eb"/>
</g>
<rect x=".5" y=".5" width="853" height="279" rx="14" fill="none" stroke="#e4e4e7"/>
</svg>
