<svg xmlns="http://www.w3.org/2000/svg" width="854" height="300" viewBox="0 0 854 300" role="img" aria-label="Tran Minh Duoc, web developer building data-heavy UIs with React &amp; Next.js">
<style>
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
.in { animation: in .8s cubic-bezier(.2,.7,.2,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.drift-a { animation: drift-a 14s ease-in-out infinite alternate; }
.drift-b { animation: drift-b 18s ease-in-out infinite alternate; }
.drift-c { animation: drift-c 16s ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate(70px, 30px) scale(1.15); } }
@keyframes drift-b { to { transform: translate(-80px, -20px) scale(.9); } }
@keyframes drift-c { to { transform: translate(40px, -35px) scale(1.1); } }
.type { animation: type 2.6s steps(44) .9s both; }
@keyframes type { from { width: 0; } }
.caret { animation: follow 2.6s steps(44) .9s both, blink 1s steps(1) 3.5s infinite; }
@keyframes follow { from { transform: translateX(-369.6px); } }
@keyframes blink { 50% { opacity: 0; } }
.pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(3); } }
.sweep { animation: sweep 4.5s cubic-bezier(.6,0,.4,1) 1.2s infinite; }
@keyframes sweep { 0%, 12% { transform: translateY(0); } 30%, 42% { transform: translateY(34px); }
  60%, 72% { transform: translateY(102px); } 90%, 100% { transform: translateY(0); } }
.float-a { animation: float 5s ease-in-out infinite alternate; }
.float-b { animation: float 6s ease-in-out 1s infinite alternate-reverse; }
@keyframes float { to { transform: translateY(-7px); } }
</style>
<defs>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
  <radialGradient id="edge" cx=".5" cy=".5" r=".5"><stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="edge-fade"><rect width="854" height="300" fill="url(#edge)"/></mask>
  <linearGradient id="row-fade" x1="0" x2="0" y1="0" y2="1"><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="table-fade"><rect width="854" height="300" fill="url(#row-fade)"/></mask>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#09090b"/><stop offset=".55" stop-color="#09090b"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a1a1aa" opacity=".35"/></pattern>
  <clipPath id="typed"><rect class="type" x="44" y="158.0" width="372" height="24"/></clipPath>
</defs>
<g mask="url(#edge-fade)">
  <g filter="url(#blur)" opacity="0.32">
    <ellipse class="drift-a" cx="560" cy="110" rx="170" ry="110" fill="#3b82f6"/>
    <ellipse class="drift-b" cx="720" cy="190" rx="150" ry="100" fill="#8b5cf6"/>
    <ellipse class="drift-c" cx="260" cy="200" rx="160" ry="90" fill="#14b8a6"/>
  </g>
  <rect width="854" height="300" fill="url(#dots)"/>
</g>
<g class="in">
  <text x="44" y="88.0" class="mono" font-size="13" fill="#2563eb">~/minhduoc-tran</text>
  <text x="41" y="138.0" class="sans" font-size="46" font-weight="750" letter-spacing="-1.4" fill="url(#name)">Tran Minh Duoc</text>
</g>
<text x="44" y="176.0" class="mono" font-size="14" fill="#52525b" clip-path="url(#typed)" textLength="370" lengthAdjust="spacingAndGlyphs">building data-heavy UIs with React &amp; Next.js</text>
<rect class="caret" x="418" y="162.0" width="8" height="17" fill="#2563eb"/>
<g class="in" style="animation-delay:.3s">
  <circle class="pulse" cx="52" cy="214.0" r="4" fill="#16a34a"/>
  <circle cx="52" cy="214.0" r="4" fill="#16a34a"/>
  <text x="66" y="219.0" class="sans" font-size="14" fill="#52525b">Web developer  ·  Cần Thơ, Việt Nam</text>
</g>

  <g mask="url(#table-fade)">
    <rect x="532" y="72" width="46" height="6" rx="3" fill="#a1a1aa" opacity=".5"/><rect x="688" y="72" width="38" height="6" rx="3" fill="#a1a1aa" opacity=".5"/><rect x="788" y="72" width="30" height="6" rx="3" fill="#a1a1aa" opacity=".5"/><g class="in" style="animation-delay:0.4s"><line x1="520" y1="89" x2="820" y2="89" stroke="#e4e4e7"/><rect x="532" y="102" width="118" height="8" rx="4" fill="#d4d4d8"/><rect x="688" y="99" width="54" height="14" rx="7" fill="#16a34a" fill-opacity=".18"/><rect x="768" y="102" width="40" height="8" rx="4" fill="#e4e4e7"/></g><g class="in" style="animation-delay:0.5s"><line x1="520" y1="123" x2="820" y2="123" stroke="#e4e4e7"/><rect x="532" y="136" width="92" height="8" rx="4" fill="#d4d4d8"/><rect x="688" y="133" width="54" height="14" rx="7" fill="#16a34a" fill-opacity=".18"/><rect x="762" y="136" width="46" height="8" rx="4" fill="#e4e4e7"/></g><g class="in" style="animation-delay:0.6s"><line x1="520" y1="157" x2="820" y2="157" stroke="#e4e4e7"/><rect x="532" y="170" width="130" height="8" rx="4" fill="#d4d4d8"/><rect x="688" y="167" width="54" height="14" rx="7" fill="#16a34a" fill-opacity=".18"/><rect x="774" y="170" width="34" height="8" rx="4" fill="#e4e4e7"/></g><g class="in" style="animation-delay:0.7s"><line x1="520" y1="191" x2="820" y2="191" stroke="#e4e4e7"/><rect x="532" y="204" width="104" height="8" rx="4" fill="#d4d4d8"/><rect x="688" y="201" width="54" height="14" rx="7" fill="#16a34a" fill-opacity=".18"/><rect x="766" y="204" width="42" height="8" rx="4" fill="#e4e4e7"/></g><g class="in" style="animation-delay:0.8s"><line x1="520" y1="225" x2="820" y2="225" stroke="#e4e4e7"/><rect x="532" y="238" width="84" height="8" rx="4" fill="#d4d4d8"/><rect x="688" y="235" width="54" height="14" rx="7" fill="#16a34a" fill-opacity=".18"/><rect x="770" y="238" width="38" height="8" rx="4" fill="#e4e4e7"/></g>
    <rect class="sweep" x="514" y="89" width="312" height="34" rx="8" fill="#2563eb" fill-opacity=".09"/>
  </g>
  <g class="float-a"><rect x="656" y="28" width="113" height="24" rx="12" fill="#2563eb" fill-opacity=".12"/><text x="667" y="44" class="mono" font-size="11.5" fill="#2563eb">status = paid</text></g>
  <g class="float-b"><rect x="542" y="278" width="113" height="24" rx="12" fill="#2563eb" fill-opacity=".12"/><text x="553" y="294" class="mono" font-size="11.5" fill="#2563eb">sort: -amount</text></g>
</svg>
