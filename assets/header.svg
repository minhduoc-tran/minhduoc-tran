<svg xmlns="http://www.w3.org/2000/svg" width="854" height="210" viewBox="0 0 854 210">
  <style>
    .name { font: 700 40px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; letter-spacing: .5px; }
    .desc { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8bb9fe; letter-spacing: 1.5px; }
    .name, .desc { animation: rise 1s cubic-bezier(.2, .7, .2, 1) both; }
    .desc { animation-delay: .35s; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset=".5" stop-color="#0d2137"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".45">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- back wave: lighter, slower, peeks out below the front one for depth -->
  <path d="M0 0H854V172Q640 205 427 180T0 188Z" fill="#2f81f7" opacity=".3">
    <animate attributeName="d" dur="12s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"
      values="M0 0H854V172Q640 205 427 180T0 188Z;
              M0 0H854V190Q640 165 427 192T0 170Z;
              M0 0H854V172Q640 205 427 180T0 188Z"/>
  </path>
  <!-- front wave: fully opaque so the colours stay deep on light backgrounds -->
  <path d="M0 0H854V165Q640 145 427 168T0 160Z" fill="url(#bg)">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"
      values="M0 0H854V165Q640 145 427 168T0 160Z;
              M0 0H854V155Q640 182 427 158T0 172Z;
              M0 0H854V165Q640 145 427 168T0 160Z"/>
  </path>
  <rect width="854" height="150" fill="url(#glow)"/>

  <g fill="#cfe3ff">
    <circle class="star" cx="96" cy="38" r="1.6"/>
    <circle class="star" cx="188" cy="104" r="1.2" style="animation-delay:.8s"/>
    <circle class="star" cx="262" cy="30" r="1" style="animation-delay:1.6s"/>
    <circle class="star" cx="610" cy="34" r="1.4" style="animation-delay:.4s"/>
    <circle class="star" cx="702" cy="96" r="1.1" style="animation-delay:2.1s"/>
    <circle class="star" cx="780" cy="44" r="1.6" style="animation-delay:1.2s"/>
  </g>

  <text class="name" x="427" y="80" text-anchor="middle" dominant-baseline="middle">Tran Minh Duoc</text>
  <text class="desc" x="427" y="122" text-anchor="middle" dominant-baseline="middle">WEB DEVELOPER · CẦN THƠ, VIET NAM</text>
</svg>
